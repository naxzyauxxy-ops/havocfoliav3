name: Build HavocFolia

on:
  push:
    branches: [main, master, "dev/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.meta.outputs.version }}
      jar_name: ${{ steps.meta.outputs.jar_name }}

    env:
      # paperweight decompiles and remaps Minecraft; it needs the headroom.
      GRADLE_OPTS: "-Xmx5G"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The patcher replays upstream history; a shallow clone breaks it.
          fetch-depth: 0

      # Java 25 and Gradle 9.6.1 are what Canvas and the Baguette template use.
      # Both come from the committed wrapper and this JDK — nothing is provisioned
      # ad hoc, so there is no version to drift.
      - name: Make wrapper executable
        # The exec bit is easily lost extracting a zip on Windows/macOS, and git
        # then records mode 100644 — so ./gradlew fails with "Permission denied".
        # Fix it permanently with:  git update-index --chmod=+x gradlew
        run: chmod +x ./gradlew scripts/*.sh || true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: zulu

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache paperweight work
        uses: actions/cache@v4
        with:
          # Decompile + remap output is many GB and identical for a given upstream
          # commit. Without this, every run pays the full cost again.
          path: |
            ~/.gradle/caches/paperweight
            .gradle/caches/paperweight
          key: paperweight-${{ hashFiles('gradle.properties') }}
          restore-keys: paperweight-

      - name: Configure git
        # The patcher drives git directly and refuses to run without an identity.
        run: |
          git config --global user.name "havocfolia-ci"
          git config --global user.email "ci@havoc.gg"
          git config --global init.defaultBranch main
          git config --global commit.gpgsign false

      - name: Apply patches
        # Clones Canvas -> Folia -> Paper, decompiles and remaps Minecraft, then
        # applies every patch layer. Nearly all the build time is here.
        run: ./gradlew applyAllPatches --stacktrace

      - name: Compile
        # Fails fast on a Java error before spending time assembling a jar.
        run: ./gradlew compileJava --stacktrace

      - name: Build paperclip jar
        run: ./gradlew createPaperclipJar --stacktrace

      - name: Collect metadata
        id: meta
        run: |
          MC=$(grep -E '^mcVersion' gradle.properties | cut -d= -f2 | tr -d ' ')
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${MC}-${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "jar_name=havocfolia-${VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: Stage artifacts
        run: |
          mkdir -p dist
          # Find the jar rather than guess its path; it has moved between versions.
          BUILT=$(find . -path '*/build/libs/*' \
            \( -name '*paperclip*.jar' -o -name '*bundler*.jar' \) | head -1)
          if [ -z "$BUILT" ]; then
            echo "::error title=No jar produced::Searched */build/libs for paperclip/bundler jars."
            find . -name '*.jar' -path '*/build/libs/*' | head -50
            exit 1
          fi
          echo "Found $BUILT"
          cp "$BUILT" "dist/${{ steps.meta.outputs.jar_name }}"
          cd dist
          sha256sum "${{ steps.meta.outputs.jar_name }}" > "${{ steps.meta.outputs.jar_name }}.sha256"
          ls -lh

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: havocfolia-${{ steps.meta.outputs.version }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Save patch rejects on failure
        # When a patch does not apply, the .rej files name the exact failing hunk.
        # Far more useful for fixing it than the Gradle stack trace.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patch-rejects
          path: |
            **/rejected/**
            **/*.rej
          retention-days: 7
          if-no-files-found: ignore

  smoke-test:
    name: Boot test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: zulu

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: havocfolia-${{ needs.build.outputs.version }}
          path: run/

      - name: Boot the server
        working-directory: run
        run: |
          echo "eula=true" > eula.txt
          cat > server.properties <<'PROPS'
          online-mode=false
          view-distance=32
          simulation-distance=6
          level-type=minecraft\:flat
          max-players=5
          spawn-protection=0
          PROPS

          # Drive stdin through a FIFO so we can stop the server the moment it is
          # up, rather than sleeping for a fixed guess.
          mkfifo stdin.pipe
          exec 3> stdin.pipe
          timeout 600 java -Xms1G -Xmx2G \
            -jar "${{ needs.build.outputs.jar_name }}" --nogui < stdin.pipe > server.log 2>&1 &
          SERVER_PID=$!

          for i in $(seq 1 300); do
            grep -q 'Done (' server.log 2>/dev/null && { echo "Up after ~${i}s."; break; }
            kill -0 "$SERVER_PID" 2>/dev/null || {
              echo "::error title=Server exited during startup::"; tail -100 server.log; exit 1; }
            sleep 1
          done

          echo "havoc version" >&3
          sleep 3
          echo "stop" >&3
          exec 3>&-
          wait "$SERVER_PID" 2>/dev/null || true

          grep -q 'Done (' server.log || {
            echo "::error title=Never reached Done::"; tail -100 server.log; exit 1; }
          grep -qi 'HavocFolia' server.log || {
            echo "::error title=Fork not loaded::Branding missing, so the hooks did not apply."; exit 1; }
          echo "Boot OK."

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: run/server.log
          retention-days: 7
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: havocfolia-${{ needs.build.outputs.version }}
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: HavocFolia ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.jar
            dist/*.sha256
