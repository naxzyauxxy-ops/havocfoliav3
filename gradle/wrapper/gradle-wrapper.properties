distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Must be 9.x. weaver 2.4.5 publishes with org.gradle.plugin.api-version=9.0.0,
# and that attribute is not backwards compatible — Gradle 8.x cannot consume it.
# 9.6.1 is what Canvas itself pins; match upstream unless you have a reason not to.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.1-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
