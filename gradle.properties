group = gg.havoc

# Canvas moved to the new Minecraft version scheme; check upstream's gradle.properties
# before bumping. This must match the Canvas commit you pin below.
mcVersion = 26.2
canvasBranch = main
apiVersion = 26.2

# Exact Canvas commit to build against. This was CraftCanvasMC/Canvas main HEAD
# on 2026-08-15 and WILL go stale — re-pin with:
#   git ls-remote https://github.com/CraftCanvasMC/Canvas.git main
# Never track a branch: patches rot silently when upstream moves under them.
canvasRef = ecfb582a81bc3b05ca8fa1208a1dda70daef1c41

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.parallel = true
org.gradle.vfs.watch = false
org.gradle.jvmargs = -Xmx4G
